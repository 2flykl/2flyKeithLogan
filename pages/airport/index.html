(() => {
  const board=document.querySelector('.board');
  const enter=document.querySelector('.enter');
  function fitScene(){
    const w=innerWidth,h=innerHeight;
    const cinematic=w>=801&&w/h>=1.25;
    document.body.classList.toggle('cinematic',cinematic);
    if(!cinematic){board.style.transform='';['left','top','width','height'].forEach(p=>enter.style[p]='');return;}
    // Full-frame 16:9 video. HUD coordinates follow the video, not the viewport.
    const sw=Math.min(w,h*16/9),sh=sw*9/16,ox=(w-sw)/2,oy=(h-sh)/2;
    // Shrink 10% toward the upper-left anchor to clear the seated character.
    const scale=.90,anchor=[.108,.006];
    const q=[[.108,.006],[.714,.211],[.714,.685],[.091,.604]].map(([x,y])=>[ox+(anchor[0]+(x-anchor[0])*scale)*sw,oy+(anchor[1]+(y-anchor[1])*scale)*sh]);
    const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=q;
    const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3;
    const dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
    const den=dx1*dy2-dx2*dy1;
    const g=(dx3*dy2-dx2*dy3)/den,k=(dx1*dy3-dx3*dy1)/den;
    const a=x1-x0+g*x1,b=x3-x0+k*x3,d=y1-y0+g*y1,e=y3-y0+k*y3;
    const bw=1160,bh=640;
    board.style.transform=`matrix3d(${a/bw},${d/bw},0,${g/bw},${b/bh},${e/bh},0,${k/bh},0,0,1,0,${x0},${y0},0,1)`;
    enter.style.left=(ox+sw*.255)+'px';
    enter.style.top=(oy+sh*.848)+'px';
    enter.style.width=Math.max(245,sw*.215)+'px';
    enter.style.height=Math.max(49,sh*.068)+'px';
  }
  let queued=false;
  addEventListener('resize',()=>{if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;fitScene()})}});
  fitScene();
})();

  const index=candidates.find(i=>i!==Number(other.dataset.clip))??candidates[0];
  sequence=[];
  if(index!==undefined)prepare(v,{index,position});else{v.classList.remove('active');v.pause();}
 });
});
function start(){if(started||!visible())return;started=true;prepare(videos[0],nextClip());prepare(videos[1],nextClip());}
document.addEventListener('visibilitychange',()=>{
 if(!visible())videos.forEach(v=>v.pause());
 else{start();if(videos[active].readyState>=2)videos[active].play().catch(()=>{});}
});
reduced.addEventListener('change',()=>{if(reduced.matches)videos.forEach(v=>v.pause());else{start();videos[active].play().catch(()=>{})}});
// One interaction can retry video playback if a browser initially blocks it.
document.addEventListener('pointerdown',()=>{if(visible())videos[active].play().catch(()=>{})},{once:true});
window.addEventListener('twofly-replay',()=>{nextRow=0;nextTitle=8;const v=videos[active];v.currentTime=0;if(visible())v.play().catch(()=>{});});
start();
})();

</script>
