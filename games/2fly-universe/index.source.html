<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#000408" />
  <meta name="2fly-build" content="2FLY-V19-FRESH-LAUNCH" />
  <title>2Fly Universe — Enter the Playable Frontier</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000408;color:#e8f4ff;font-family:Arial,sans-serif}
    #universe-root{position:fixed;inset:0;background:#000408}#universe-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
    #ui-layer,#overlay-layer,#css3d-layer{position:absolute;inset:0}#ui-layer{z-index:10;pointer-events:none}#ui-layer>*{pointer-events:auto}#overlay-layer{z-index:20;pointer-events:none}#overlay-layer>.overlay-active{pointer-events:auto}#css3d-layer{z-index:15;pointer-events:none;overflow:hidden}
    #loading-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,rgba(15,66,92,.18),transparent 35%),#000408;transition:opacity .55s ease}
    .launch-card{width:min(560px,88vw);text-align:center;padding:34px 26px;border:1px solid rgba(105,185,220,.22);border-radius:18px;background:rgba(2,8,14,.76);box-shadow:0 18px 70px rgba(0,0,0,.46)}
    .eyebrow{font:600 10px monospace;letter-spacing:.28em;color:#4d9fc7;margin-bottom:16px}.title{font:700 clamp(24px,4vw,42px) monospace;letter-spacing:.24em;color:#9fd8ff;text-shadow:0 0 28px rgba(73,173,230,.3)}
    .sub{margin:14px auto 24px;max-width:430px;color:#66879e;font:500 11px/1.7 monospace;letter-spacing:.13em}.launch-btn{border:1px solid rgba(104,205,255,.52);background:rgba(22,102,145,.18);color:#bfe8ff;border-radius:999px;padding:13px 24px;font:700 11px monospace;letter-spacing:.2em;cursor:pointer;transition:.2s}.launch-btn:hover{background:rgba(34,137,185,.3);transform:translateY(-1px)}
    .load-ring{display:none;width:38px;height:38px;margin:0 auto 18px;border:2px solid #102331;border-top-color:#76c8f7;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    #loading-status{min-height:18px;margin-top:16px;color:#527990;font:600 10px monospace;letter-spacing:.18em;text-transform:uppercase}.micro{margin-top:16px;color:#2f4d60;font:500 9px monospace;letter-spacing:.12em}
    #launch-retry{display:none;margin-top:14px}.hidden{display:none!important}
  </style>
</head>
<body>
  <div id="universe-root" aria-label="2Fly Universe interactive spatial archive">
    <canvas id="universe-canvas" aria-label="3D Universe viewport"></canvas>
    <div id="ui-layer" aria-hidden="false"></div>
    <div id="overlay-layer" aria-hidden="true"></div>
    <div id="css3d-layer"></div>
  </div>

  <div id="loading-screen" role="dialog" aria-label="Enter 2Fly Universe">
    <div class="launch-card">
      <div class="load-ring" id="load-ring"></div>
      <div class="eyebrow">THE PLAYABLE FRONTIER</div>
      <div class="title">2FLY UNIVERSE</div>
      <div class="sub">Explore the eras, orbit the galaxies, select the media, and thrust through the Universe.</div>
      <button class="launch-btn" id="launch-btn" type="button">ENTER THE UNIVERSE</button>
      <button class="launch-btn" id="launch-retry" type="button">RETRY LAUNCH</button>
      <div id="loading-status">Navigation core ready.</div>
      <div class="micro">LEFT DRAG · ORBIT &nbsp;&nbsp; RIGHT MOUSE · THRUST</div>
    </div>
  </div>

  <script type="module">
    const launchBtn=document.getElementById('launch-btn');
    const retryBtn=document.getElementById('launch-retry');
    const ring=document.getElementById('load-ring');
    const status=document.getElementById('loading-status');
    let launching=false;
    async function launch(){
      if(launching)return; launching=true;
      launchBtn.classList.add('hidden'); retryBtn.style.display='none'; ring.style.display='block';
      status.style.color='#527990'; status.textContent='Loading updated Universe…';
      try{
        const mod=await import('./app-v19/main.js?v=19.1');
        status.textContent='Building galaxies & navigation…';
        await mod.startUniverse();
      }catch(err){
        launching=false; ring.style.display='none'; retryBtn.style.display='inline-block';
        status.style.color='#f07b7b'; status.textContent='Launch interrupted — retry available.';
        console.error('[2Fly V19 launcher]',err);
      }
    }
    launchBtn.addEventListener('click',launch); retryBtn.addEventListener('click',launch);
    window.addEventListener('2fly-universe-ready',()=>{ status.textContent='Universe ready.'; });
    window.addEventListener('error',e=>console.error('[2Fly V19 window error]',e.error||e.message));
    window.addEventListener('unhandledrejection',e=>console.error('[2Fly V19 rejection]',e.reason));
  </script>
</body>
</html>
