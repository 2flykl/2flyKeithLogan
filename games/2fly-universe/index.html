    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000408;color:#e8f4ff;font-family:'Space Grotesk',Arial,sans-serif}
    #universe-root{position:fixed;inset:0;background:#000408}#universe-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

    #loading-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,rgba(15,66,92,.18),transparent 35%),#000408;transition:opacity .55s ease}
    .launch-card{width:min(560px,88vw);text-align:center;padding:34px 26px;border:1px solid rgba(105,185,220,.22);border-radius:18px;background:rgba(2,8,14,.76);box-shadow:0 18px 70px rgba(0,0,0,.46)}

    .sub{margin:14px auto 24px;max-width:440px;color:#66879e;font:500 11px/1.7 'Space Mono',monospace;letter-spacing:.12em}.launch-btn{border:1px solid rgba(104,205,255,.52);background:rgba(22,102,145,.18);color:#bfe8ff;border-radius:999px;padding:13px 24px;font:700 11px 'Space Mono',monospace;letter-spacing:.2em;cursor:pointer;transition:.2s}.launch-btn:hover{background:rgba(34,137,185,.3);transform:translateY(-1px)}
    .load-ring{display:none;width:38px;height:38px;margin:0 auto 18px;border:2px solid #102331;border-top-color:#76c8f7;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    #loading-status{min-height:18px;margin-top:16px;color:#527990;font:600 10px 'Space Mono',monospace;letter-spacing:.16em;text-transform:uppercase}.micro{margin-top:16px;color:#2f4d60;font:500 9px 'Space Mono',monospace;letter-spacing:.12em}#launch-retry{display:none;margin-top:14px}.hidden{display:none!important}
