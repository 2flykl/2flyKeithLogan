<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#000408" />
  <meta name="2fly-build" content="2FLY-CINEMATIC-DEPTH-V6.2-RC1" />
  <title>2FLY Universe — A Living Constellation</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000408;color:#e8f4ff;font-family:'Space Grotesk',Arial,sans-serif}
    #universe-root{position:fixed;inset:0;background:#000408}#universe-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
    #ui-layer,#overlay-layer,#css3d-layer{position:absolute;inset:0}#ui-layer{z-index:10;pointer-events:none}#ui-layer>*{pointer-events:auto}#overlay-layer{z-index:20;pointer-events:none}#overlay-layer>.overlay-active{pointer-events:auto}#css3d-layer{z-index:15;pointer-events:none;overflow:hidden}
    #loading-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,rgba(15,66,92,.18),transparent 35%),#000408;transition:opacity .55s ease}
    .launch-card{width:min(560px,88vw);text-align:center;padding:34px 26px;border:1px solid rgba(105,185,220,.22);border-radius:18px;background:rgba(2,8,14,.76);box-shadow:0 18px 70px rgba(0,0,0,.46)}
    .eyebrow{font:600 10px 'Space Mono',monospace;letter-spacing:.28em;color:#4d9fc7;margin-bottom:16px}.title{font:700 clamp(24px,4vw,42px) 'Space Mono',monospace;letter-spacing:.24em;color:#9fd8ff;text-shadow:0 0 28px rgba(73,173,230,.3)}
    .sub{margin:14px auto 24px;max-width:440px;color:#66879e;font:500 11px/1.7 'Space Mono',monospace;letter-spacing:.12em}.launch-btn{border:1px solid rgba(104,205,255,.52);background:rgba(22,102,145,.18);color:#bfe8ff;border-radius:999px;padding:13px 24px;font:700 11px 'Space Mono',monospace;letter-spacing:.2em;cursor:pointer;transition:.2s}.launch-btn:hover{background:rgba(34,137,185,.3);transform:translateY(-1px)}
    .load-ring{display:none;width:38px;height:38px;margin:0 auto 18px;border:2px solid #102331;border-top-color:#76c8f7;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    #loading-status{min-height:18px;margin-top:16px;color:#527990;font:600 10px 'Space Mono',monospace;letter-spacing:.16em;text-transform:uppercase}.micro{margin-top:16px;color:#2f4d60;font:500 9px 'Space Mono',monospace;letter-spacing:.12em}#launch-retry{display:none;margin-top:14px}.hidden{display:none!important}
  </style>
  <script type="importmap">{"imports":{"three":"./assets/three.module.js"}}</script>
  <link rel="stylesheet" href="./remaster.css">
  <link rel="icon" href="./assets/ui/map.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./navigation-safety.css">
</head>
<body>
  <div id="universe-root" aria-label="2Fly Universe interactive spatial archive">
    <canvas id="universe-canvas" aria-label="3D Universe viewport"></canvas>
    <div id="ui-layer"></div><div id="overlay-layer" aria-hidden="true"></div><div id="css3d-layer"></div>
  </div>
  <div id="loading-screen" role="dialog" aria-label="Enter 2Fly Universe">
    <div class="launch-card"><div class="load-ring" id="load-ring"></div><div class="eyebrow">KEITH “2FLY” LOGAN · A LIVING CONSTELLATION</div><div class="title">2FLY UNIVERSE</div><div class="sub">One life. Many worlds.<br>Travel through the music, imagination, and evolving creative legacy of Keith “2fly” Logan.</div><button class="launch-btn" id="launch-btn" type="button">ENTER THE UNIVERSE</button><button class="launch-btn" id="launch-retry" type="button">RETRY LAUNCH</button><div id="loading-status">Music. Memory. Play. Possibility.</div><div class="micro">DRAG TO ORBIT &nbsp; · &nbsp; SCROLL TO APPROACH &nbsp; · &nbsp; FOLLOW A SIGNAL</div></div>
  </div>
  <script>if(location.protocol==="file:"){document.getElementById("loading-status").textContent="Double-click START_2FLY_UNIVERSE.bat to enter. This 3D archive needs a local server.";document.getElementById("launch-btn").disabled=true;}else{const s=document.createElement("script");s.type="module";s.src="./launcher-v23.js";document.body.appendChild(s);}</script>
</body>
</html>
