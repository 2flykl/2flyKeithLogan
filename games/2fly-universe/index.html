  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000408;
      color: #e8eaf0;
      font-family: 'Space Grotesk', sans-serif;
    }
    #universe-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #universe-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #ui-layer > * {
      pointer-events: auto;
    }
    #overlay-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }
    #overlay-layer > .overlay-active {
      pointer-events: auto;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #000408;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 1.5rem;
    }
    #loading-screen .load-title {
      font-family: 'Space Mono', monospace;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      letter-spacing: 0.3em;
      color: #8ab4d4;
      text-transform: uppercase;
    }
    #loading-screen .load-sub {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: #3a5068;
      text-transform: uppercase;
    }
    .load-ring {
      width: 48px;
      height: 48px;
      border: 2px solid #0d1f2d;
      border-top-color: #8ab4d4;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .load-ring { animation: none; opacity: 0.6; }
    }
  </style>

  <script type="module" src="./app/main.js"></script>

  <div id="loading-screen" role="status" aria-live="polite" aria-label="Loading 2Fly Universe">
    <div class="load-ring" aria-hidden="true"></div>
    <div class="load-title">2FLY UNIVERSE</div>
    <div class="load-sub" id="loading-status">Initializing cosmos…</div>
  </div>

  <div id="universe-root" aria-label="2Fly Universe — interactive spatial archive">
    <canvas id="universe-canvas" aria-label="3D Universe viewport"></canvas>
    <div id="ui-layer" aria-hidden="false"></div>
    <div id="overlay-layer" aria-hidden="true"></div>
    <div id="css3d-layer" style="position:absolute;inset:0;pointer-events:none;z-index:15;overflow:hidden;"></div>
  </div>
