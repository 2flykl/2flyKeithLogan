<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#040713">
  <title>2Fly Universe — Cosmic Visual Overhaul</title>
  <meta name="description" content="Explore the 2Fly Universe across eras, galaxies, signatures, and playable destinations.">
  <link rel="stylesheet" href="./styles/flyverse.css">
  <script src="./scripts/flyverse-data.js" defer></script>
  <script src="./scripts/flyverse-engine.js" defer></script>
  <script src="./scripts/flyverse-ui.js" defer></script>
  <script src="./scripts/flyverse-app.js" defer></script>
</head>
<body>
  <main id="flyverse" class="flyverse-shell" aria-label="2Fly Universe playable experience">
    <canvas id="universe" aria-label="Interactive 2Fly Universe canvas"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>
    <div id="reticle" aria-hidden="true"></div>

    <header class="hud hud-top">
      <div class="hud-group hud-left">
        <div class="mini-brand">2FLY UNIVERSE</div>
        <button id="reset" type="button">Reset View</button>
      </div>

      <div class="brand-lockup" aria-label="Universe title">
        <div class="brand-title">2 F L Y&nbsp;&nbsp; U N I V E R S E</div>
        <div class="brand-subtitle">EXPLORE · DISCOVER · CONNECT</div>
      </div>

      <div class="hud-group hud-right">
        <button id="random" type="button">Take Me Somewhere</button>
        <button id="place" type="button">Place Star</button>
        <button id="tour" type="button">Build Your Own Tour</button>
      </div>
    </header>

    <aside id="navigator" class="navigator" aria-label="Galactic navigator"></aside>

    <section id="card" class="object-card" aria-live="polite" hidden>
      <button id="close" class="icon-btn close-btn" type="button" aria-label="Close">×</button>
      <div class="eyebrow" id="ctype">Star</div>
      <div class="card-preview">
        <img id="cardimg" alt="Selected object preview">
      </div>
      <h2 id="ctitle"></h2>
      <p id="cmeta" class="meta"></p>
      <p id="ccopy" class="copy"></p>
      <div id="cactions" class="actions"></div>
    </section>

    <section id="tourpanel" class="overlay-panel" hidden aria-label="Build your own tour">
      <button id="tourclose" class="icon-btn close-btn" type="button" aria-label="Close">×</button>
      <div class="panel-header">
        <div>
          <div class="eyebrow">BUILD YOUR OWN TOUR</div>
          <h2>Curate a route across the universe</h2>
        </div>
      </div>
      <input id="search" type="search" placeholder="Search stars, travelers, galaxies, experiences…">
      <div id="catalog" class="catalog"></div>
      <div class="queue-wrap">
        <div class="eyebrow">TOUR QUEUE</div>
        <div id="queue" class="queue"></div>
      </div>
      <button id="starttour" class="start-tour" type="button">Start Tour</button>
    </section>

    <footer class="hud hud-bottom">
      <div class="legend-dots">
        <span><i class="dot music"></i> Music</span>
        <span><i class="dot moments"></i> Moments</span>
        <span><i class="dot memories"></i> Memories</span>
        <span><i class="dot live"></i> Live</span>
      </div>
      <div class="controls-tip">SCROLL TO ZOOM &nbsp; · &nbsp; DRAG TO EXPLORE &nbsp; · &nbsp; SHIFT + DRAG TO ORBIT CAMERA</div>
    </footer>
  </main>
</body>
</html>
