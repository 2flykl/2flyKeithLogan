<!doctype html><html><head><meta charset="utf-8"><title>2Fly SVG Asset Verification</title><style>
body{margin:0;background:#050913;color:#dff7ff;font-family:system-ui;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}.card{background:#09111f;border:1px solid #17344d;border-radius:14px;padding:14px}.card img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.name{font:12px monospace;opacity:.78;margin-top:8px;word-break:break-all}h1{font-size:22px}
</style></head><body><h1>2Fly Universe — SVG Crispness Pass</h1><p>All vector assets below are loaded directly from the same paths used by the Universe runtime.</p><div class="grid" id="grid"></div><script>
const files=['artwork_moon.svg','behind_moon.svg','booking_sat.svg','collab_sat.svg','controller_planet.svg','game_asset_moon.svg','lyrics_moon.svg','merch_sat.svg','photo_moon.svg','press_sat.svg','social_sat.svg','song_moon.svg','space_station.svg','stem_moon.svg','streaming_sat.svg','video_moon.svg','youtube_sat.svg'];
const grid=document.getElementById('grid');for(const f of files){const c=document.createElement('div');c.className='card';const i=new Image();i.src='assets/object_styles/'+f;i.alt=f;const n=document.createElement('div');n.className='name';n.textContent=f;c.append(i,n);grid.append(c)}
</script></body></html>
