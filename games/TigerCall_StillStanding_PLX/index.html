<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Tiger Call: Still Standing</title>
  <link rel="stylesheet" href="styles.css?v=clean1">
</head>
<body data-stripes="0">
  <main id="gameShell">
    <video id="performanceVideo" muted loop playsinline preload="auto" src="assets/video/tiger-call-still-standing.mp4"></video>
    <div id="videoShade"></div>
    <audio id="gameplayAudio" preload="auto" src="assets/audio/TigerCall_FinalMaster.wav"></audio>

    <div id="sideLeft" class="sideRail"></div>
    <div id="sideRight" class="sideRail"></div>
    <div id="confetti"></div>

    <canvas id="gameCanvas"></canvas>

    <header id="hud">
      <div class="brand"><b>TIGER CALL</b><span>STILL STANDING</span></div>
      <div class="scoreBox">SCORE <strong id="score">0000000</strong><small>COMBO <b id="combo">0</b></small><em id="judge">READY</em></div>
      <div class="hype">HYPE<div><i id="hypeFill"></i></div></div>
      <button id="pauseBtn" type="button">Ⅱ</button>
    </header>

    <div id="markerLabel"></div>
    <button id="retrySound" type="button">TAP FOR SOUND</button>

    <section id="startScreen" class="screen active">
      <div class="startCard">
        <small>A PLAYABLE RAYEN TRIBUTE</small>
        <h1><span>TIGER</span> CALL</h1>
        <h2>STILL STANDING</h2>
        <p>Inside the formation. One WAV clock. One human performance MIDI. One tempo/marker MIDI.</p>
        <div class="controls"><kbd>I</kbd><kbd>O</kbd><kbd>P</kbd><kbd>9</kbd><span>LEFT · DOWN · RIGHT · UP</span></div>
        <button id="startBtn" type="button" disabled>ENTER THE FORMATION</button>
        <div id="loadStatus">LOADING CLEAN RHYTHM SOURCES…</div>
      </div>
    </section>

    <section id="pauseScreen" class="screen">
      <div class="smallCard"><h2>PAUSED</h2><button id="resumeBtn" type="button">RESUME</button></div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="smallCard"><h2>TIGER CALL COMPLETE</h2><p id="resultScore">0</p><button id="replayBtn" type="button">PLAY AGAIN</button></div>
    </section>
  </main>

  <script src="src/midiParser.js?v=clean1"></script>
  <script src="src/game.js?v=clean1"></script>
</body>
</html>
