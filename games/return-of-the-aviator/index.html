<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#02050a" />
<title>Return of the Aviator — Revision IX</title>
<link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
<div id="shell">
  <canvas id="game" width="1280" height="720"></canvas>
  
  <div id="mobileControls" aria-label="Touch Game Controls">
    <div class="dpadCluster">
      <button data-key="ArrowUp" class="padUp">▲</button>
      <button data-key="ArrowLeft" class="padLeft">◄</button>
      <button data-key="ArrowRight" class="padRight">►</button>
      <button data-key="ArrowDown" class="padDown">▼</button>
    </div>
    <div class="actionCluster">
      <button data-key="ShiftLeft" class="btnBurst">BURST</button>
      <button data-key="Space" class="btnFire">FIRE</button>
    </div>
  </div>

  <section id="start-overlay">
    <div class="lockup">
      <div class="eyebrow">2FLY vs THE ALGORITHM</div>
      <h1>RETURN OF<br>THE AVIATOR</h1>
      <div class="edition">REVISION IX // MOTION & GAMEPLAY REFINEMENT</div>
      <p>Four acts. Two plays of <strong>Too Fast</strong>. One continuous mission.</p>
      <button id="start" disabled>LOADING FLIGHT SYSTEMS…</button>
      <small>WASD / Arrows move · ↑/W jump/resist · ↓/S power dive · Space fire · Shift sonic burst · F2 debug</small>
    </div>
  </section>
  <div id="fatal"></div>
</div>
<script src="game-rev9.js?v=9.1.0"></script>
</body>
</html>
