   let gr=g.createLinearGradient(x-f.w/2,y-20,x+f.w/2,y+20);gr.addColorStop(0,'#08070b');gr.addColorStop(.5,'#26132b');gr.addColorStop(1,'#07151a');
   g.fillStyle=gr;g.strokeStyle='#e0ad43';g.lineWidth=3;
   g.beginPath();g.moveTo(x-f.w/2,y-17);
   for(let k=0;k<=8;k++){let xx=x-f.w/2+k*f.w/8;g.lineTo(xx,y-17+(k%2?5:-2))}
   g.lineTo(x+f.w/2,y+20);g.lineTo(x-f.w/2,y+20);g.closePath();g.fill();g.stroke();
   g.shadowBlur=0;g.strokeStyle='rgba(235,193,94,.18)';g.lineWidth=1;
   for(let k=1;k<6;k++){g.beginPath();g.moveTo(x-f.w/2+k*f.w/6,y-15);g.lineTo(x-f.w/2+(k+1)*f.w/6,y+18);g.stroke()}
   g.fillStyle='#f2c45f';g.font='900 24px Arial';g.textAlign='center';g.fillText(f.t,x,y+8);g.restore()
 })
}function doorDraw(){if(P.x<6200||P.x>TUN+300)return;let x=DOOR-cam,y=ground(DOOR);g.fillStyle='#030305';g.fillRect(x-70,y-220,140,220);g.strokeStyle=door?'#e3b34d':'#725126';g.lineWidth=7;g.strokeRect(x-70,y-220,140,220);let A=['I AM CAPABLE','I AM WORTHY','I CHOOSE GROWTH','I AM ENOUGH','I TRUST MYSELF'];A.forEach((q,i)=>{let xx=6520+i*115-cam,yy=y-285-(i%2)*42;g.fillStyle=choice===i?'#b07a2c':'#09080b';g.fillRect(xx-50,yy-28,100,56);g.strokeStyle='#b98638';g.lineWidth=2;g.strokeRect(xx-50,yy-28,100,56);g.fillStyle='#e3b65c';g.font='700 9px Arial';g.textAlign='center';g.fillText(`${i+1} • ${q}`,xx,yy+3)})}


function museumLabels(){let s=scene();if(s===6){let a=['PAST','PRESENT','FUTURE'];a.forEach((q,i)=>{let x=TUNEND+330+i*520-cam;g.fillStyle='rgba(220,169,70,.55)';g.font='900 22px Arial';g.textAlign='center';g.fillText(q,x,H*.18)})}if(s===7){g.fillStyle='#b98a3e';g.font='900 18px Arial';g.textAlign='center';g.fillText(mirrorDone?'MASTER YOURSELF':'THE MIRROR',W*.5,H*.16)}}
function tunnel(){
 if(scene()!==5)return;g.fillStyle='#000';g.fillRect(0,0,W,H);
 let x=P.x-cam,y=P.y,pulse=.75+.25*Math.sin(T*.08);g.save();g.translate(x,y);
 g.strokeStyle=`rgba(226,172,69,${pulse})`;g.lineWidth=3;g.shadowColor='#e2ac45';g.shadowBlur=20;
 g.beginPath();g.moveTo(-16,-85);g.lineTo(-11,-102);g.lineTo(-3,-91);g.lineTo(5,-106);g.lineTo(14,-86);g.closePath();g.stroke();
 // The body disappears into black; only earned royal identifiers occasionally breathe.
 g.globalAlpha=.18+.12*Math.sin(T*.055);g.shadowBlur=5;g.lineWidth=1.5;g.beginPath();g.arc(0,-52,9,.2,Math.PI-.2);g.stroke();
 g.beginPath();g.moveTo(18,-25);g.lineTo(23,-22);g.stroke();g.restore()
}
function mirror(){if(scene()!==7)return;let mx=MIRROR-cam,y=ground(MIRROR);g.strokeStyle=mirrorDone?'#d9ae55':'#6e295c';g.lineWidth=8;g.beginPath();g.ellipse(mx,y-120,95,155,0,0,7);g.stroke();if(!mirrorDone){g.save();g.translate(mx+160,y);g.scale(-1,1);g.fillStyle='#050507';g.beginPath();g.arc(0,-70,15,0,7);g.fill();g.fillRect(-13,-55,26,45);g.strokeStyle='#050507';g.lineWidth=12;g.beginPath();g.moveTo(-8,-42);g.lineTo(-22,-18);g.moveTo(8,-42);g.lineTo(23,-18);g.moveTo(-7,-9);g.lineTo(-12,18);g.moveTo(7,-9);g.lineTo(14,18);g.stroke();g.restore()}}
function burst(x,y,n=35){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-.8)*10,l:45})}
function particlesDraw(){for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--;g.fillStyle='#d8a23a';g.fillRect(p.x-cam,p.y,4,4)}particles=particles.filter(p=>p.l>0)}
function land(old){let best=ground(P.x),idx=-1;if(P.vy>=0)faith.forEach((f,i)=>{if(!f.v)return;let edge=f.w/2+115;if(Math.abs(P.x-f.x)<edge&&old<=H*f.y+12&&P.y>=H*f.y-8&&H*f.y<best){best=H*f.y;idx=i;if(Math.abs(P.x-f.x)>f.w/2-28)P.x=clamp(P.x,f.x-f.w/2+34,f.x+f.w/2-34)}});if(isFinite(best)&&P.vy>=0&&P.y>=best){P.y=best;P.vy=0;P.on=true;P.plat=idx;if(idx>=0&&launchX){let d=Math.abs(P.x-launchX);if(d>80&&d<520)learnedJump=lerp(learnedJump,clamp(d,190,390),.50)}return true}P.on=false;return false}

function update(){if(!started)return;T++;if(intro<150)intro++;let dir=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);if(dir)P.face=dir;let leapMode=scene()===2;let max=leapMode?(P.royal?4.55:4.15):(P.royal?6.45:4.95),acc=leapMode?.12:(P.royal?.32:.24);P.vx+=dir*acc;P.vx*=dir?(leapMode?.91:.965):(leapMode?.61:.78);if(Math.abs(P.vx)<.06)P.vx=0;P.vx=clamp(P.vx,-max,max);if(P.x<60&&P.vx<0)P.vx=0;if(cool)cool--;
 if(K.Space&&P.on){
 let pl=P.plat??-1;
 let forwardCommit=false,n=-1;
 if(scene()===2&&rock.gone){
   if(pl<0){
     forwardCommit=(P.x>CLIFF-120&&P.vx>.65&&P.face>0);
     if(forwardCommit)n=0;
   }else if(pl>=0&&pl<2){
     let f=faith[pl],edge=f.x+f.w/2;
     forwardCommit=(P.x>edge-95&&P.vx>.55&&P.face>0);
     if(forwardCommit)n=pl+1;
   }
 }
 P.vy=P.royal?-13.1:-10.8;P.on=false;P.plat=-1;
 if(forwardCommit&&n>=0&&n<3){pending=n;launchX=P.x}
}
 P.vy+=.7;let old=P.y||ground(P.x);P.x+=P.vx;P.y+=P.vy;if(!isFinite(P.y))P.y=old;
 // walls and struggle
 for(let i=0;i<walls.length;i++){let w=walls[i];if(!w.dead&&P.x>w.x-110&&P.x<w.x+110){if(P.royal&&Math.abs(P.vx)>4.5){w.dead=1;burst(w.x,gy()*.5,65);shake=12}else{if(i===0&&!P.royal&&!gift&&!P.on&&!cool){attempts++;cool=28;if(attempts>=3){gift=true;giftX=clamp(P.x,260,walls[0].x-210);burst(giftX,gy()-150,45)}}P.x=w.x-115;P.vx=-1.4}}}
 if(gift&&!P.royal&&Math.abs(P.x-giftX)<54&&P.y<gy()-70){
   gift=false;crownPickup.active=true;crownPickup.x=giftX;crownPickup.y=gy()-205;crownPickup.vy=-1.4;crownPickup.vx=-P.face*1.35;
   burst(giftX,gy()-150,55);flash=4;
 }
 if(crownPickup.active){
   crownPickup.vy+=.18;crownPickup.y+=crownPickup.vy;crownPickup.x+=crownPickup.vx;
   let floorY=gy()-34;if(crownPickup.y>floorY){crownPickup.y=floorY;crownPickup.vy=0}
   let left=70,right=walls[0].x-145;
   if(crownPickup.x<left){crownPickup.x=left;crownPickup.vx=Math.abs(crownPickup.vx)}
   if(crownPickup.x>right){crownPickup.x=right;crownPickup.vx=-Math.abs(crownPickup.vx)}
   if(Math.abs(P.x-crownPickup.x)<48&&Math.abs((P.y-65)-crownPickup.y)<70){
     crownPickup.active=false;P.royal=true;crown=true;burst(P.x,P.y-80,95);flash=10;
   }
 }
 // boulder
 if(!rock.gone){if(!rock.fall){rock.y=ground(rock.x)-rock.r;if(P.royal&&P.x<rock.x&&rock.x-P.x<145&&dir>0){let dx=.52;rock.x+=dx;rock.rot+=dx/rock.r;P.x=rock.x-118;P.vx*=.68;rock.progress=clamp((rock.x-2700)/(CLIFF-2780),0,1);if(T%9===0)burst(rock.x-55,rock.y+45,4)}if(rock.x>CLIFF-92){rock.fall=true;rock.x=CLIFF+5;rock.vx=2.8;rock.vy=0;P.x=CLIFF-220;P.vx=-2.5;P.vy=-2;P.on=false;flash=12;shake=16}}else{rock.x+=rock.vx;rock.y+=rock.vy;rock.rot+=rock.vx/rock.r;rock.vy+=.55;if(P.x>CLIFF-70){P.x=CLIFF-70;P.vx=0}if(rock.y>H+130){rock.gone=true}}}
 // faith adaptive reveal — only after a committed FORWARD edge jump
 if(pending>=1&&!faith[pending].v&&P.vy>=-1){
   let prev=faith[pending-1],f=faith[pending];
   let prevEdge=prev.x+prev.w/2;
   if(pending===1){
     f.x=prevEdge+300;f.w=620;
   }else if(pending===2){
     f.x=Math.min(LAND-410,prevEdge+350);f.w=Math.max(820,(LAND-(f.x-f.w/2))+190);
   }
   f.v=1;burst(f.x,H*f.y,44);pending=-1;
 }
 // first fall: allow offscreen before camera descends; safety spawn BLACK if needed
 if(pending===0&&!faith[0].v&&P.x>CLIFF&&P.y>H+70){
   faith[0].x=clamp(P.x,CLIFF+260,LAND-1040);faith[0].w=620;faith[0].v=1;
   P.x=faith[0].x;P.y=H*faith[0].y;P.vy=0;P.on=true;P.plat=0;
   pending=-1;firstFaithReveal=true;faithCam=true;camYTarget=H*.26;burst(P.x,P.y,58);
 }
 land(old);if(P.y>H+240){
   if(scene()===2&&pending===0){/* cinematic fall still active */}
   else if(P.x<LAND){P.x=CLIFF-230;P.y=ground(P.x);P.vx=P.vy=0;P.on=true;P.plat=-1}
   else{P.y=ground(P.x);P.vy=0;P.on=true}
 }
 if(!door&&P.x>DOOR-90){P.x=DOOR-90;P.vx=-.8}if(door&&P.x>DOOR+50&&P.x<TUNEND)P.vx=Math.max(P.vx,3.2);
 if(scene()===6){let u=clamp((P.x-TUNEND)/(GALEND-TUNEND),0,1);P.age=u}
 if(scene()===7&&!mirrorDone&&P.x>MIRROR-650){if(Math.abs(P.vx)<.12&&!dir&&!K.Space)still++;else still=0;if(still>150){mirrorDone=true;burst(P.x,P.y-70,100);flash=10}if(P.x>MIRROR-370){P.x=MIRROR-370;P.vx=-2}}
 // camera: intro zoom handled in render; faith first reveal camera deliberately lags then descends
 let target=Math.max(0,P.x-W*.28);
 if(scene()===2){
   if(P.plat===0)camYTarget=H*.26;
   else if(P.plat===1)camYTarget=H*.12;
   else if(P.plat===2||P.x>=LAND-100)camYTarget=0;
 }else camYTarget=0;
 camY+= (camYTarget-camY)*.035;
 if(faithCam){target=Math.max(0,P.x-W*.5);if(Math.abs(cam-target)<8)faithCam=false}
 cam+=(target-cam)*(faithCam?.018:.075);
 if(shake>0)shake*=.86;if(flash>0)flash--;}

function render(){requestAnimationFrame(render);update();g.save();if(shake)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);if(scene()===2)g.translate(0,-camY);museumWorld();walls.forEach(wall);giftDraw();crownPickupDraw();rockDraw();faithDraw();doorDraw();museumLabels();mirror();particlesDraw();if(scene()===5)tunnel();else hero();if(flash){g.fillStyle=`rgba(255,245,220,${flash/14})`;g.fillRect(0,0,W,H)}g.restore();
 // intro starts on pure black silhouette close-up, pulls back to wide shot
 if(started&&intro<125){let q=clamp(intro/125,0,1),ease=1-Math.pow(1-q,3);g.save();g.fillStyle='#000';g.globalAlpha=1-ease*.96;g.fillRect(0,0,W,H);g.globalAlpha=1;let z=lerp(9,1,ease);g.translate(W*.5,H*.62);g.scale(z,z);g.translate(-(P.x-cam),-P.y);hero();g.restore();}
 if(started&&intro>125&&intro<175){g.globalAlpha=(175-intro)/50;g.fillStyle='#e6b650';g.font='900 14px Arial';g.textAlign='center';g.fillText('BREAK WHAT WAS BUILT TO STOP YOU',W*.5,H*.13);g.globalAlpha=1}}
render();
