<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyZone Studio — Interactive Voice & Beat Generator</title>
  <meta name="description" content="Interactive FlyZone studio with Keith's voice personality system and selectable music-generation engines.">
  <link rel="stylesheet" href="css/flyzone.css">
</head>
<body>

  <!-- Header & Status Bar -->
  <header class="studio-header">
    <div class="brand-title">
      <h1>⚡ FLYZONE STUDIO <span class="badge-dev">V2.5 DEMO</span></h1>
    </div>
    <div class="header-status">
      <span class="status-pill" id="engineStatusPill">ENGINE: AUTO</span>
      <span class="status-pill" id="sunoDevStatusPill">FLYZONE ENGINE 2 (READY)</span>
      <button class="btn-mute" id="muteToggleBtn">🔊 VOICE ON</button>
    </div>
  </header>

  <!-- Studio Main Content -->
  <main class="studio-container">
    
    <!-- Studio Video Background Container -->
    <div class="studio-hero-bg" aria-hidden="true">
      <div class="studio-glow"></div>
    </div>

    <!-- Creation Console -->
    <section class="studio-card">
      
      <!-- Engine Selector -->
      <div>
        <div class="section-title">FlyZone Engine Selector</div>
        <div class="engine-rack" id="engineSelector">
          <button class="engine-btn active" data-engine="AUTO">AUTO</button>
          <button class="engine-btn" data-engine="ENGINE_1">FLYZONE ENGINE 1</button>
          <button class="engine-btn" data-engine="ENGINE_2">FLYZONE ENGINE 2</button>
        </div>
      </div>

      <!-- Natural-Language Prompt Section -->
      <div class="prompt-section">
        <div class="section-title">JUST TELL ME WHAT YOU WANT</div>
        <div class="prompt-box-container">
          <textarea 
            id="userPromptInput" 
            class="prompt-textarea" 
            rows="3"
            placeholder="e.g. Dark soulful hip-hop beat around 82 BPM with live drums, Rhodes, bass guitar, a little guitar texture, and cinematic strings. Keep it warm and human, not overly polished."
          ></textarea>
        </div>

        <!-- Prompt Modes -->
        <div class="prompt-modes-rack">
          <button class="mode-btn active" id="modeLiteralBtn" data-mode="LITERAL">
            <span>●</span> LITERALLY LIKE THIS
          </button>
          <button class="mode-btn" id="modeRefineBtn" data-mode="REFINE">
            <span>⚡</span> LET 2FLY REFINE THE PROMPT
          </button>
        </div>
      </div>

      <!-- Refined Prompt Comparison Card (Shown when Refine mode is triggered) -->
      <div class="refinement-card hidden" id="refinementCard">
        <div class="refinement-grid">
          
          <div class="refinement-column">
            <div class="refinement-label">YOUR IDEA</div>
            <div class="original-prompt-display" id="originalPromptDisplay">No prompt entered yet.</div>
          </div>

          <div class="refinement-column">
            <div class="refinement-label">2FLY'S REFINEMENT</div>
            <textarea id="refinedPromptInput" class="refined-textarea" rows="3"></textarea>
          </div>

        </div>

        <div class="refinement-actions">
          <button class="btn-secondary" id="useOriginalBtn">USE MY ORIGINAL</button>
          <button class="btn-primary" id="generateRefinedBtn">GENERATE THIS</button>
        </div>
      </div>

      <!-- Optional Production Controls Rack -->
      <div>
        <div class="section-title">Structured Production Menus (Optional)</div>
        <div class="params-grid">
          
          <div class="param-group">
            <label for="genreSelect">GENRE</label>
            <select id="genreSelect" class="param-select">
              <option value="">Any Genre</option>
              <option value="Hip-Hop">Hip-Hop</option>
              <option value="Trap">Trap</option>
              <option value="Soul / R&B">Soul / R&B</option>
              <option value="Lo-Fi">Lo-Fi</option>
              <option value="Afrobeats">Afrobeats</option>
              <option value="Electronic">Electronic</option>
            </select>
          </div>

          <div class="param-group">
            <label for="moodSelect">MOOD</label>
            <select id="moodSelect" class="param-select">
              <option value="">Any Mood</option>
              <option value="Soulful">Soulful</option>
              <option value="Dark / Aggressive">Dark / Aggressive</option>
              <option value="Chilled">Chilled</option>
              <option value="Triumphant">Triumphant</option>
              <option value="Cinematic">Cinematic</option>
            </select>
          </div>

          <div class="param-group">
            <label for="drumSelect">DRUMS</label>
            <select id="drumSelect" class="param-select">
              <option value="">Any Drums</option>
              <option value="Live Drums">Live Drums</option>
              <option value="808 Drums">808 Drums</option>
              <option value="Boom Bap">Boom Bap</option>
              <option value="Percussive Tribal">Percussive Tribal</option>
            </select>
          </div>

          <div class="param-group">
            <label for="bpmSelect">TEMPO (BPM)</label>
            <select id="bpmSelect" class="param-select">
              <option value="85">85 BPM</option>
              <option value="92" selected>92 BPM</option>
              <option value="120">120 BPM</option>
              <option value="140">140 BPM</option>
            </select>
          </div>

          <div class="param-group">
            <label for="instrumentSelect">INSTRUMENTS</label>
            <select id="instrumentSelect" class="param-select">
              <option value="">Any Instruments</option>
              <option value="Rhodes & Horns">Rhodes & Horns</option>
              <option value="Analog Synth">Analog Synth</option>
              <option value="Acoustic Guitar">Acoustic Guitar</option>
              <option value="Grand Piano">Grand Piano</option>
            </select>
          </div>

        </div>
      </div>

      <!-- Primary Action Button -->
      <div class="action-area">
        <button class="btn-generate" id="generateBtn">GENERATE BEAT</button>
      </div>

    </section>

  </main>

  <!-- Player Bar -->
  <footer class="player-bar">
    <div class="player-info">
      <strong id="trackTitle">No track generated yet</strong>
      <span id="trackMeta">Describe your beat or make selections and press GENERATE BEAT</span>
    </div>
    <audio id="audioPlayer" controls preload="auto"></audio>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
