<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Christmas on the Block • 2fly Keith Logan</title><style>*{box-sizing:border-box}body{margin:0;background:#112e38;color:#fff8df;font-family:Arial,sans-serif;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;touch-action:none}button,a{font:inherit}button{cursor:pointer;border:2px solid #efd998;background:#7d2438;color:#fff8df;border-radius:12px;padding:14px 23px;font-weight:900;box-shadow:0 5px 0 #381e30}#hud{position:absolute;inset:18px 20px auto;display:flex;justify-content:space-between;gap:10px;pointer-events:none;font-weight:900;text-shadow:0 2px #172735}.pill{background:#173b45e8;border:2px solid #dec780;border-radius:12px;padding:10px 16px}#tip{position:absolute;top:83px;width:100%;text-align:center;font-weight:bold;text-shadow:0 2px 3px #142b38;pointer-events:none}#controls{position:absolute;bottom:22px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;touch-action:none;min-width:100px;user-select:none}#cover{background:#1d655b}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b243bb3;backdrop-filter:blur(5px);padding:20px}.card{width:min(680px,100%);background:#153a45f5;border:2px solid #dbc488;border-radius:22px;padding:28px;text-align:center;box-shadow:0 24px 90px #071a28}.eyebrow{letter-spacing:3px;font-size:11px;color:#e5cc86;font-weight:bold}h1{font-size:clamp(32px,6vw,56px);line-height:.95;margin:14px 0;color:#fff3d2;text-transform:uppercase;letter-spacing:-2px}p{line-height:1.5;color:#d7e7e7}.album{display:flex;gap:16px;align-items:center;text-align:left;margin:20px auto;max-width:420px}.album img{width:100px;box-shadow:4px 5px #091d2b}.album small{display:block;color:#dcca93;line-height:1.5}a{color:#edd18a}#sound{position:absolute;bottom:90px;right:20px;paddin const c=document.querySelector('canvas'),g=c.getContext('2d'),$=s=>document.querySelector(s);let W,H,scale;function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);scale=Math.min(W/1100,H/730)}onresize=resize;resize();let state='menu',time=0,last=0,elapsed=0,score=0,hp=5,kills=0,round=0,duck=false,firing=false,aim={x:.5,y:.45},cool=0,anim=1,particles=[],shots=[],incoming=[],foes=[],snowman=1,bossHits=0,targets=[false,false,false],messageTime=0,muted=false,combo=0,audio;

function panel(end=false){$('#overlay').style.display='flex';$('#card').innerHTML=`<div class="eyebrow">2FLY KEITH LOGAN PRESENTS</div><h1>${end?'Snow much<br>for your cover!':'Christmas<br>on the Block'}</h1><p>${end?`You scored <b>${score.toLocaleString()} points</b>. The block will remember that snow day.`:'A cinematic snow day. Three neighborhood encounters. One very smug snowman.'}</p><div class="album"><img src="album.jpg" alt="Aye I Wish You the Merriest Christmas album"><div><b>Aye I Wish You the Merriest Christmas</b><small>The Christmas album by 2fly Keith Logan</small><a href="https://2flyKeithLogan.com" target="_blank" rel="noopener">Explore the album ↗</a></div></div><p style="font-size:13px">Mouse / drag to aim · Hold throw for rapid fire<br>← → switch cover · ↓ / Space to duck · P to pause<br>Finale: use the scenery to beat the giant snowman.</p><button id="start">${end?'PLAY AGAIN':'LET’S SNOW!'}</button><p style="font-size:11px">Soundtrack: Aye I Wish You the Merriest Christmas • 2fly Keith Logan</p>`;$('#start').onclick=start}
function start(){state='play';elapsed=0;score=0;hp=8;kills=0;round=0;combo=0;snowman=1;bossHits=0;targets=[false,false,false];particles=[];shots=[];incoming=[];duck=firing=false;cool=0;$('#overlay').style.display='none';spawn();sound(700,.2);toast('WELCOME TO THE BLOCK!')}

function toast(s){$('#toast').textContent=s;messageTime=2.3}function burst(x,y,n=35,color='#fff'){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*520,vy:-Math.random()*380,r:3+Math.random()*10,life:.5+Math.random()*.5,color})}

function throwBall(){if(state!=='play'||duck||cool>0)return;cool=.32;anim=0;sound(410,.06);let x=aim.x*W,y=aim.y*H;shots.push({x,y,t:0,done:false});}
function impact(x,y){if(round===2){let t=targetPoints();for(let i=0;i<3;i++)if(!targets[i]&&Math.hypot(x-t[i].x,y-t[i].y)<Math.max(38,55*scale)){targets[i]=true;bossHits++;score+=750;burst(t[i].x,t[i].y,80);for(let j=0;j<45;j++)particles.push({x:W*.51+(Math.random()-.5)*W*.25,y:H*.2,vx:(Math.random()-.5)*60,vy:150+Math.random()*130,r:9+Math.random()*18,life:1.8,color:'#fff'});toast(['TREE SHAKE! +750','ROOF AVALANCHE! +750','SNOWED UNDER! +750'][bossHits-1]);sound(110,.3,'sawtooth');if(bossHits===3){setTimeout(()=>{if(state==='play'){state='win';panel(true)}},2000)}return}if(Math.hypot((x-W*.51)/1.1,y-H*.53)<H*.23*snowman){snowman=Math.min(1.65,snowman+.035);burst(x,y,20);toast('“THANKS FOR THE EXTRA COVER!”');return}}
for(let f of [...foes].reverse()){let p=pos(f),r=42*scale*f.size;if(!f.down&&visible(f)&&Math.abs(x-p.x)<r&&Math.abs(y-(p.y-40*scale*f.size))<r*1.5){f.down=true;f.hit=time;combo++;kills++;score+=100+Math.min(200,combo*20);burst(x,y,50);toast(['SNOW BUSINESS!','SLEIGHED IT!','ICE TO MEET YOU!','POWDER POWER!'][kills%4]);sound(150,.14,'square');return}}burst(x,y,14)}

function house(x,y,w,h,col){roundRect(x,y,w,h,2,col);g.fillStyle='#f2eff5';g.beginPath();g.moveTo(x-w*.07,y);g.lineTo(x+w*.5,y-h*.25);g.lineTo(x+w*1.07,y);g.fill();g.stroke();for(let a=0;a<3;a++)for(let b=0;b<2;b++){roundRect(x+w*(.12+a*.29),y+h*(.13+b*.34),w*.16,h*.2,1,'#ffce78');line(x+w*(.2+a*.29),y+h*(.13+b*.34),x+w*(.2+a*.29),y+h*(.33+b*.34))}roundRect(x+w*.4,y+h*.69,w*.2,h*.31,2,'#304958');for(let i=0;i<12;i++)ellipse(x+i*w/11,y+5,3,4,['#f9d27b','#e3555b','#77dbc1'][i%3],false);for(let i=0;i<8;i++)line(x+10,y+20+i*17,x+w*.08,y+15+i*17,'#5d395255',1)}
function environment(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#393d70');sky.addColorStop(.5,'#dc8795');sky.addColorStop(1,'#f8d4aa');g.fillStyle=sky;g.fillRect(0,0,W,H);ellipse(W*.77,H*.15,30*scale,30*scale,'#fff2cc',false);for(let i=0;i<10;i++){let w=W*.16,h=H*(.24+(i%3)*.03);house(i*W*.115-W*.04,H*.42-h,w,h,colors[i%5])}g.fillStyle='#d5e4f0';g.beginPath();g.moveTo(0,H*.49);g.lineTo(W,H*.49);g.lineTo(W,H);g.lineTo(0,H);g.fill();g.fillStyle='#a8bdd6';g.beginPath();g.moveTo(W*.46,H*.49);g.lineTo(W*.58,H*.49);g.lineTo(W*.9,H);g.lineTo(W*.1,H);g.fill();for(let i=0;i<12;i++){let yy=H*(.51+i*.047);line(W*.15,yy,W*.85,yy+12,'#f0f3fc55',1)}
// street lamps and album poster

if(album.complete){g.save();g.translate(W*.81,H*.34);roundRect(-4,-4,95*scale+8,95*scale+8,2,'#c1a879');g.drawImage(album,0,0,95*scale,95*scale);g.restore()}
if(round===2){line(W*.23,H*.15,W*.23,H*.48,'#634c49',16*scale);line(W*.23,H*.27,W*.12,H*.23,'#634c49',9*scale);ellipse(W*.23,H*.27,W*.14,16*scale,'#f4f5fa');roundRect(W*.62,H*.27,W*.2,H*.03,3,'#fcf9fb');roundRect(W*.83,H*.38,45*scale,50*scale,6,'#b73a51');let pts=targetPoints();for(let i=0;i<3;i++)if(!targets[i]){g.strokeStyle='#ffe293';g.lineWidth=3;g.beginPath();g.arc(pts[i].x,pts[i].y,25*scale+Math.sin(time*5)*3,0,7);g.stroke();g.fillStyle='#ffe293';g.font=`bold ${15*scale}px Arial`;g.textAlign='center';g.fillText(['BRANCH','AWNING','BELLS'][i],pts[i].x,pts[i].y-33*scale)}}
}
function person(f){let p=pos(f),s=scale*f.size,up=visible(f),reaction=f.down?time-f.hit:0;if(f.down&&reaction>1.35)return;g.save();g.translate(p.x,p.y);if(f.down){g.translate(reaction*110*s,reaction*reaction*100*s);g.rotate(reaction*(f.phase%2?5:-5));g.globalAlpha=Math.max(0,1-reaction/1.4)}else if(!up)g.translate(0,57*s);g.scale(s,s);line(-11,0,-17,26,'#283b56',14);line(10,0,19,26,'#283b56',14);roundRect(-24,-57,48,64,12,f.color);roundRect(-28,-13,56,14,4,'#e9bc7e');line(-21,-42,-43,-20,f.color,15);line(21,-42,44,-62-Math.sin(time*4+f.phase)*9,f.color,15);ellipse(44,-68,12,12,'#fbfcff');ellipse(0,-78,24,27,f.skin);roundRect(-26,-102,52,14,6,f.color);ellipse(0,-107,20,16,f.color);ellipse(0,-124,9,9,'#fff7e5');ellipse(-8,-79,2.5,3,'#fff');ellipse(8,-79,2.5,3,'#fff');line(-7,-66,7,-66,'#fff',3);if(f.down){g.fillStyle='#fff';g.font='bold 20px Arial';g.fillText('OOF!',-20,-145)}g.restore()}
function obstacle(x,y,w,h,col='#a94b58'){roundRect(x,y,w,h,12,col);roundRect(x-5,y-8,w+10,17,8,'#f8f9fc');for(let i=0;i<5;i++)line(x+10+i*w/5,y+20,x+5+i*w/5,y+h-6,'#1d344644',1)}
function snowBoss(){let s=H*.14*snowman,x=W*.51,y=H*.64;ellipse(x,y,s,s*.66,'#d0deeb');ellipse(x,y-s*.7,s*.75,s*.6,'#f3f6fc');ellipse(x,y-s*1.43,s*.5,s*.46,'#fff9ee');ellipse(x-s*.15,y-s*1.52,4,4,'#26394a');ellipse(x+s*.15,y-s*1.52,4,4,'#26394a');g.fillStyle='#ed9b48';g.beginPath();g.moveTo(x,y-s*1.43);g.lineTo(x+s*.45,y-s*1.33);g.lineTo(x,y-s*1.26);g.fill();roundRect(x-s*.61,y-s*1.04,s*1.22,s*.17,5,'#9e3249');roundRect(x-s*.42,y-s*2.1,s*.84,s*.34,4,'#25394c');roundRect(x-s*.58,y-s*1.81,s*1.16,s*.1,3,'#25394c');}
function hands(){let s=Math.max(.6,scale),y=H+ (duck?70:0),a=anim<1?anim:1;for(let side of [-1,1]){let x=W*.5+side*Math.min(W*.25,260*s),yy=y-25*s;let ball=true;if(side===1&&a<.34){yy-=Math.sin(a/.34*Math.PI)*150*s;ball=false}if(a>.34&&a<.65)x=W*.5+side*70*s;if(side===-1&&a>.65&&a<1){yy+=Math.sin((a-.65)/.35*Math.PI)*90*s;ball=a>.9}g.save();g.translate(x,yy);g.rotate(side*-.3);roundRect(-48*s,-40*s,96*s,155*s,26*s,'#aa354b');roundRect(-49*s,38*s,98*s,28*s,4,'#e8c993');line(-25*s,0,-25*s,35*s,'#6a2b43',3);line(0,0,0,35*s,'#6a2b43',3);if(ball){ellipse(0,-58*s,38*s,35*s,'#fafcff');ellipse(-10*s,-67*s,12*s,8*s,'#dfebf6',false)}g.restore()}}
function update(dt){time+=dt;if(state!=='play')return;elapsed+=dt;cool-=dt;anim=Math.min(1,anim+dt*3.2);if(firing)throwBall();if(messageTime>0){messageTime-=dt;if(messageTime<=0)$('#toast').textContent=''}if(round<2){for(let f of foes){if(f.down&&time-f.hit>2.5){f.down=false;f.phase=Math.random()*7}if(f.runner){f.x+=dt*.17;if(f.x>1.15){f.x=-.15;f.down=false}}if(!f.down&&visible(f)&&Math.random()<dt*.10)incoming.push({x:pos(f).x,y:pos(f).y-70*scale,t:0})}if(round===0&&kills>=8){round=1;elapsed=0;toast('SNOW DAY SPRINT!');foes=[];for(let i=0;i<8;i++)foes.push({x:-.2-i*.18,y:.6+(i%2)*.08,size:.73,runner:true,skin:skin[i%5],color:colors[i%5],phase:i,hit:0,down:false})}if(round===1&&elapsed>14){round=2;foes=[];incoming=[];toast('BOSS: DON’T FEED THE SNOWMAN!')}}else{if(Math.random()<dt*.55&&bossHits<3)incoming.push({x:W*.64,y:H*.46,t:0})}

$('#stage').textContent=['THE BLOCK · 8 HITS','SNOW DAY SPRINT','THE BIG SNOWMAN'][round];$('#score').textContent=score.toLocaleString()+' PTS';$('#hp').textContent='♥ '.repeat(Math.max(0,hp));$('#tip').textContent=duck?'IN COVER • Release to throw':round===2?'Aim at the glowing branch, awning & bells!':round===1?'Moving targets! Keep the snowballs flying.':'Aim at opponents when they pop up. Duck incoming snowballs!';}
function draw(dt){environment();for(let f of foes)person(f);if(round!==2){for(let i=0;i<5;i++){let f=foes[i];if(!f||f.runner)continue;let p=pos(f);obstacle(p.x-48*scale*f.size,p.y-5*scale,96*scale*f.size,42*scale,colors[i])}}else{let f={x:.65,y:.6,size:1.2,phase:0,down:false,skin:skin[1],color:colors[1]};if(bossHits<3)person(f);snowBoss()}
for(let b of incoming){let t=b.t,x=b.x*(1-t)+W*.5*t,y=b.y*(1-t)+H*.62*t;ellipse(x,y,7+32*t,7+32*t,'#fff');if(t>.65){g.fillStyle='#aa3049';g.font='bold 18px Arial';g.textAlign='center';g.fillText('DUCK!',x,y-45)}}for(let b of shots){let t=Math.min(1,b.t/.14);ellipse(W*.7*(1-t)+b.x*t,H*.95*(1-t)+b.y*t,24*(1-t)+6,24*(1-t)+6,'#fff')}
for(let p of particles){if(state==='play'||state==='win'||state==='over'){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}g.globalAlpha=Math.max(0,Math.min(1,p.life*2));ellipse(p.x,p.y,p.r,p.r*.8,p.color,false)}g.globalAlpha=1;particles=particles.filter(p=>p.life>0);for(let i=0;i<70;i++){let x=(i*151.73+time*(9+i%5))%W,y=(i*83.13+time*(18+i%11))%H;ellipse(x,y,1.4+i%3,1.4+i%3,'#fff',false)}
obstacle(-20,H*(duck?.67:.86),W*.38,H*.35,'#91abc6');obstacle(W*.78,H*(duck?.68:.88),W*.27,H*.35,'#91abc6');hands();if(duck){g.fillStyle='#123c4a66';g.fillRect(0,0,W,H)}let x=aim.x*W,y=aim.y*H;g.strokeStyle='#fff8d8';g.lineWidth=2;g.beginPath();g.arc(x,y,11,0,7);g.stroke();line(x-19,y,x-7,y,'#fff8d8',2);line(x+7,y,x+19,y,'#fff8d8',2);line(x,y-19,x,y-7,'#fff8d8',2);line(x,y+7,x,y+19,'#fff8d8',2)}
function frame(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);draw(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
c.addEventListener('pointermove',e=>{aim={x:e.clientX/W,y:e.clientY/H}});c.addEventListener('pointerdown',e=>{aim={x:e.clientX/W,y:e.clientY/H};firing=true;c.setPointerCapture(e.pointerId)});c.addEventListener('pointerup',()=>firing=false);c.addEventListener('pointercancel',()=>firing=false);function hold(id,set){let el=$(id);el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);set(true)};el.onpointerup=el.onpointercancel=()=>set(false)}hold('#fire',v=>firing=v);hold('#cover',v=>duck=v);onkeydown=e=>{if(e.code==='Space'){e.preventDefault();duck=true}if(e.code==='KeyP'){if(state==='play'){state='pause';toast('PAUSED • Press P to resume')}else if(state==='pause'){state='play';toast('LET IT SNOW!')}}};onkeyup=e=>{if(e.code==='Space')duck=false};onblur=()=>{firing=false;duck=false;if(state==='play'){state='pause';$('#toast').textContent='PAUSED • Tap here to resume';$('#toast').style.pointerEvents='auto'}};$('#toast').onclick=()=>{if(state==='pause'){state='play';$('#toast').style.pointerEvents='none';toast('LET IT SNOW!')}};$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'SOUND OFF':'SOUND ON'};panel();
