<!doctype html><html><head><meta charset="utf-8"><title>2Fly WebGL Diagnostic</title>
<style>html,body{background:#02070d;color:#dff4ff;font-family:Arial;margin:0;padding:30px}.card{max-width:760px;margin:auto;border:1px solid #21475d;border-radius:16px;padding:24px;background:#07111b}.ok{color:#59f0c6}.bad{color:#ff7777}code{color:#9bd8ff}</style></head><body><div class="card"><h1>2Fly Universe — WebGL Diagnostic</h1><div id="out">Testing…</div></div>
<script>
const out=document.getElementById('out');
const c=document.createElement('canvas');
let gl=null,err='';
try{gl=c.getContext('webgl2',{failIfMajorPerformanceCaveat:false,powerPreference:'default'});}catch(e){err=String(e)}
if(gl){
 const dbg=gl.getExtension('WEBGL_debug_renderer_info');
 const vendor=dbg?gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL):gl.getParameter(gl.VENDOR);
 const renderer=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
 out.innerHTML='<p class="ok"><b>WEBGL2: AVAILABLE</b></p><p>Vendor: <code>'+vendor+'</code></p><p>Renderer: <code>'+renderer+'</code></p><p>Version: <code>'+gl.getParameter(gl.VERSION)+'</code></p><p>You should be able to run the full 3D Universe.</p>';
}else{
 out.innerHTML='<p class="bad"><b>WEBGL2: NOT AVAILABLE IN THIS BROWSER SESSION</b></p><p>'+err+'</p><p>Close the current Universe tab and double-click <code>START_FULL_3D_GPU_SAFE.bat</code>.</p>';
}
</script></body></html>
