<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #222; color: #fff; font-family: sans-serif; text-align: center; }
    canvas { border: 2px solid #555; background: #000; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>targets_sheet.png Raw View</h1>
  <div>
    <canvas id="canvas"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = '../assets/targets/targets_sheet.png';
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      
      // Draw grid lines every 50px
      ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)';
      ctx.lineWidth = 1;
      for (let x = 0; x < img.width; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, img.height);
        ctx.stroke();
        ctx.fillStyle = '#ff0055';
        ctx.fillText(x, x + 2, 10);
      }
      for (let y = 0; y < img.height; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(img.width, y);
        ctx.stroke();
        ctx.fillStyle = '#ff0055';
        ctx.fillText(y, 2, y + 10);
      }
    };
  </script>
</body>
</html>
