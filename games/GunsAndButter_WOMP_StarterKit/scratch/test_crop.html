<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    .target-test { display: inline-block; margin: 15px; border: 2px dashed #ff2a85; padding: 10px; background: #000; }
    canvas { background: #222; }
    input { width: 60px; }
  </style>
</head>
<body>
  <h1>Tweak Target Crops</h1>
  <div id="container"></div>

  <script>
    const targets = {
      bullseye: { x: 120, y: 15, w: 66, h: 76 },
      silhouette: { x: 18, y: 12, w: 66, h: 68 },
      speaker: { x: 15, y: 168, w: 72, h: 72 },
      crate: { x: 116, y: 118, w: 74, h: 80 },
      barrel: { x: 118, y: 226, w: 70, h: 90 },
      terminal: { x: 16, y: 250, w: 70, h: 70 }
    };

    const img = new Image();
    img.src = '../assets/targets/targets_sheet.png';
    img.onload = () => {
      const container = document.getElementById('container');
      for (let k in targets) {
        const div = document.createElement('div');
        div.className = 'target-test';
        div.innerHTML = `<h3>${k}</h3>`;
        
        const canvas = document.createElement('canvas');
        canvas.width = 120;
        canvas.height = 120;
        const ctx = canvas.getContext('2d');
        
        div.appendChild(canvas);
        
        const controls = document.createElement('div');
        controls.innerHTML = `
          X: <input type="number" class="val-x" value="${targets[k].x}">
          Y: <input type="number" class="val-y" value="${targets[k].y}">
          W: <input type="number" class="val-w" value="${targets[k].w}">
          H: <input type="number" class="val-h" value="${targets[k].h}">
        `;
        div.appendChild(controls);
        container.appendChild(div);

        const draw = () => {
          ctx.clearRect(0, 0, 120, 120);
          const x = parseInt(controls.querySelector('.val-x').value);
          const y = parseInt(controls.querySelector('.val-y').value);
          const w = parseInt(controls.querySelector('.val-w').value);
          const h = parseInt(controls.querySelector('.val-h').value);
          
          ctx.drawImage(img, x, y, w, h, 60 - w/2, 60 - h/2, w, h);
        };

        controls.querySelectorAll('input').forEach(inp => inp.addEventListener('input', draw));
        draw();
      }
    };
  </script>
</body>
</html>
