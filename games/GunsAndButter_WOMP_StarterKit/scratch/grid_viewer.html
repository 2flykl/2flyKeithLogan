<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; margin: 20px; }
    .sheet { margin-bottom: 30px; position: relative; display: inline-block; background: #222; border: 2px solid #555; }
    .title { font-weight: bold; margin-bottom: 5px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <h1>Guns & Butter Asset Sheet Grid Viewer</h1>
  <div id="container"></div>

  <script>
    const assets = [
      { name: 'cd_double_barrel_states.png', url: '../assets/weapons/cd_double_barrel_states.png', cw: 256, ch: 256 },
      { name: 'keytar_rifle_states.png', url: '../assets/weapons/keytar_rifle_states.png', cw: 256, ch: 256 },
      { name: 'african_american_arm_rig_states.png', url: '../assets/character/african_american_arm_rig_states.png', cw: 256, ch: 256 },
      { name: 'projectile_icons_clean.png', url: '../assets/projectiles/projectile_icons_clean.png', cw: 256, ch: 256 },
      
      { name: 'hand_cannon_808.png', url: '../assets/weapons/hand_cannon_808.png', cw: 184, ch: 175 },
      { name: 'harp_javelin.png', url: '../assets/weapons/harp_javelin.png', cw: 184, ch: 174 },
      { name: 'note_rifle.png', url: '../assets/weapons/note_rifle.png', cw: 184, ch: 184 },
      { name: 'vinyl_launcher.png', url: '../assets/weapons/vinyl_launcher.png', cw: 184, ch: 184 },
      { name: 'first_person_states.png', url: '../assets/character/first_person_states.png', cw: 92, ch: 184 },
      
      { name: 'projectiles_sheet.png', url: '../assets/projectiles/projectiles_sheet.png', cw: 115, ch: 109 }, // 4x3 ? 461x327
      { name: 'targets_sheet.png', url: '../assets/targets/targets_sheet.png', cw: 102, ch: 109 }, // 3x3 ? 307x327
      { name: 'effects_sheet.png', url: '../assets/vfx/effects_sheet.png', cw: 102, ch: 102 } // 3x2 ? 307x205
    ];

    const container = document.getElementById('container');

    assets.forEach(asset => {
      const wrapper = document.createElement('div');
      wrapper.style.margin = '20px';
      wrapper.style.display = 'inline-block';
      
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = `${asset.name} (Cell: ${asset.cw}x${asset.ch})`;
      wrapper.appendChild(title);

      const img = new Image();
      img.onload = () => {
        const div = document.createElement('div');
        div.className = 'sheet';
        
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        // draw grid
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 1;
        for (let x = 0; x <= img.width; x += asset.cw) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, img.height);
          ctx.stroke();
        }
        for (let y = 0; y <= img.height; y += asset.ch) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(img.width, y);
          ctx.stroke();
        }

        // draw labels
        ctx.fillStyle = 'yellow';
        ctx.font = '10px sans-serif';
        let idx = 0;
        for (let y = 0; y < img.height; y += asset.ch) {
          for (let x = 0; x < img.width; x += asset.cw) {
            ctx.fillText(idx++, x + 5, y + 15);
          }
        }

        div.appendChild(canvas);
        wrapper.appendChild(div);
      };
      img.src = asset.url;
      container.appendChild(wrapper);
    });
  </script>
</body>
</html>
