<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #222; color: #fff; font-family: sans-serif; text-align: center; }
    canvas { border: 2px solid #555; background: #000; margin: 10px; }
  </style>
</head>
<body>
  <h1>States Sheets Raw View</h1>
  <div>
    <h3>cd_double_barrel_states.png</h3>
    <canvas id="c-cd"></canvas>
  </div>
  <div>
    <h3>keytar_rifle_states.png</h3>
    <canvas id="c-keytar"></canvas>
  </div>
  <script>
    const setupCanvas = (id, src) => {
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.src = src;
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        ctx.strokeStyle = 'rgba(255,0,0,0.5)';
        for (let x = 0; x < img.width; x += 100) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, img.height); ctx.stroke();
          ctx.fillStyle = '#f0f'; ctx.fillText(x, x+2, 10);
        }
        for (let y = 0; y < img.height; y += 100) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(img.width, y); ctx.stroke();
          ctx.fillStyle = '#f0f'; ctx.fillText(y, 2, y+10);
        }
      };
    };
    setupCanvas('c-cd', '../assets/weapons/cd_double_barrel_states.png');
    setupCanvas('c-keytar', '../assets/weapons/keytar_rifle_states.png');
  </script>
</body>
</html>
