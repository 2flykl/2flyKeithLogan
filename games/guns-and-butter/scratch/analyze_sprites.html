<!DOCTYPE html>
<html>
<head>
  <title>Analyze Sprite Sheets</title>
</head>
<body>
  <h1>Analyzing... check console</h1>
  <script>
    const images = [
      '../assets/weapons/cd_double_barrel_states.png',
      '../assets/weapons/hand_cannon_808.png',
      '../assets/weapons/harp_javelin.png',
      '../assets/weapons/keytar_rifle_states.png',
      '../assets/weapons/note_rifle.png',
      '../assets/weapons/vinyl_launcher.png',
      '../assets/character/african_american_arm_rig_states.png',
      '../assets/character/first_person_states.png',
      '../assets/projectiles/projectiles_sheet.png',
      '../assets/projectiles/projectile_icons_clean.png',
      '../assets/targets/targets_sheet.png',
      '../assets/vfx/effects_sheet.png',
      '../assets/boards/production_board_01.png',
      '../assets/boards/production_board_02.png',
      '../assets/boards/production_board_03.png',
      '../assets/boards/production_board_04.png'
    ];

    async function analyzeImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const imgData = ctx.getImageData(0, 0, img.width, img.height);
          const data = imgData.data;

          // Simple horizontal projection to find column boundaries
          // and vertical projection to find row boundaries
          const colHasData = new Array(img.width).fill(false);
          const rowHasData = new Array(img.height).fill(false);

          for (let y = 0; y < img.height; y++) {
            for (let x = 0; x < img.width; x++) {
              const alpha = data[(y * img.width + x) * 4 + 3];
              if (alpha > 5) { // some threshold
                colHasData[x] = true;
                rowHasData[y] = true;
              }
            }
          }

          // Let's print out the continuous bands
          const findBands = (arr) => {
            const bands = [];
            let inBand = false;
            let start = 0;
            for (let i = 0; i < arr.length; i++) {
              if (arr[i] && !inBand) {
                start = i;
                inBand = true;
              } else if (!arr[i] && inBand) {
                bands.push({ start, end: i - 1 });
                inBand = false;
              }
            }
            if (inBand) {
              bands.push({ start, end: arr.length - 1 });
            }
            return bands;
          };

          const cols = findBands(colHasData);
          const rows = findBands(rowHasData);

          console.log(`=== IMAGE: ${src} (${img.width}x${img.height}) ===`);
          console.log(`Columns (${cols.length}):`, cols.map(c => `${c.start}-${c.end} (w:${c.end-c.start+1})`).join(', '));
          console.log(`Rows (${rows.length}):`, rows.map(r => `${r.start}-${r.end} (h:${r.end-r.start+1})`).join(', '));

          resolve({ src, width: img.width, height: img.height, cols, rows });
        };
        img.onerror = () => {
          console.error(`Failed to load image: ${src}`);
          resolve(null);
        };
        img.src = src;
      });
    }

    async function run() {
      for (const img of images) {
        await analyzeImage(img);
      }
      console.log("DONE_ANALYZE");
    }
    run();
  </script>
</body>
</html>
