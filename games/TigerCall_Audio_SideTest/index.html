<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiger Call Audio Side Test</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;
  }
  .card{
    width:min(720px,92vw);padding:36px;border:2px solid #ff6200;
    background:#120700;box-shadow:0 0 40px #ff620033;
  }
  h1{margin:0 0 8px;font-size:clamp(34px,7vw,72px);font-style:italic}
  h1 span{color:#ff6200}
  p{color:#ccc;line-height:1.45}
  button{
    width:100%;min-height:72px;margin-top:22px;border:0;background:#ff6200;
    color:#080808;font-size:24px;font-weight:900;cursor:pointer;
  }
  button:active{transform:scale(.99)}
  #status{
    margin-top:20px;padding:16px;border:1px solid #522000;background:#090503;
    font:700 15px/1.5 monospace;white-space:pre-wrap
  }
  .ok{color:#8cff8c}.bad{color:#ff8585}.wait{color:#ffbf60}
</style>
</head>
<body>
<div class="card">
  <h1>TIGER <span>CALL</span></h1>
  <p>This page tests only one thing: does music begin from a direct user click?</p>
  <button id="playBtn" type="button">PLAY MUSIC</button>
  <div id="status" class="wait">READY — click PLAY MUSIC.</div>

  <audio id="mp3" preload="auto" src="assets/TigerCall_FinalMaster.mp3?v=side-test-1"></audio>
  <audio id="wav" preload="auto" src="assets/TigerCall_FinalMaster.wav?v=side-test-1"></audio>
</div>

<script>
(() => {
  const btn = document.getElementById('playBtn');
  const status = document.getElementById('status');
  const mp3 = document.getElementById('mp3');
  const wav = document.getElementById('wav');

  function show(text, cls){
    status.textContent = text;
    status.className = cls || '';
  }

  async function tryAudio(el, label){
    el.pause();
    try { el.currentTime = 0; } catch(e) {}
    el.muted = false;
    el.volume = 1;

    await el.play();

    // Confirm that playback time actually advances.
    await new Promise(resolve => setTimeout(resolve, 350));
    if (el.paused || el.currentTime <= 0.02) {
      throw new Error(label + ' play() resolved but time did not advance.');
    }
    return el.currentTime;
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    show('TRYING MP3...', 'wait');

    try {
      const t = await tryAudio(mp3, 'MP3');
      wav.pause();
      show(
        'SUCCESS\n\nPLAYING: TigerCall_FinalMaster.mp3\ncurrentTime: ' +
        t.toFixed(3) + ' s\n\nIf you hear music here, browser audio is working.',
        'ok'
      );
      btn.textContent = 'RESTART MUSIC';
      btn.disabled = false;
      return;
    } catch (mp3Err) {
      console.error('MP3 failed:', mp3Err);
      show('MP3 FAILED — TRYING WAV...', 'wait');
    }

    try {
      const t = await tryAudio(wav, 'WAV');
      mp3.pause();
      show(
        'SUCCESS\n\nPLAYING: TigerCall_FinalMaster.wav\ncurrentTime: ' +
        t.toFixed(3) + ' s\n\nIf you hear music here, browser audio is working.',
        'ok'
      );
      btn.textContent = 'RESTART MUSIC';
      btn.disabled = false;
      return;
    } catch (wavErr) {
      console.error('WAV failed:', wavErr);
      show(
        'BOTH FILES FAILED TO PLAY.\n\nOpen DevTools → Console for the exact browser error.\n' +
        'This test contains no game code, MIDI, video, or animation.',
        'bad'
      );
      btn.textContent = 'TRY AGAIN';
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
